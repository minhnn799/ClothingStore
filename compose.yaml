name: clothingstore
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ClothingStore
      POSTGRES_USER: clothingstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clothingstore -d ClothingStore"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: ./backend
      dockerfile: 01.API/Dockerfile
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Database=ClothingStore;Username=clothingstore;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Jwt__Issuer: ClothingStore
      Jwt__Audience: ClothingStore
      Jwt__ExpirationMinutes: "30"
      Database__ApplyMigrations: "true"
      Storage__Provider: Local
      SeedAdmin__Email: "${ADMIN_EMAIL:-}"
      SeedAdmin__Password: "${ADMIN_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
  webapp:
    build:
      context: ./webapp
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_URL: http://api:8080
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    depends_on:
      - api
volumes:
  postgres-data:
  uploads:
